<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nine carat jewelry — Designs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #080808;
            --surface: #101010;
            --surface-hover: #161616;
            --line: rgba(255, 255, 255, 0.07);
            --muted: #8a8680;
            --muted-deep: #5c5854;
            --fg: #f0ebe5;
            --focus-ring: rgba(240, 235, 229, 0.28);
        }
        html {
            color-scheme: dark;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 400;
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-serif {
            font-family: 'Newsreader', Georgia, serif;
        }
        .nav-blur {
            backdrop-filter: blur(16px) saturate(1.1);
            -webkit-backdrop-filter: blur(16px) saturate(1.1);
        }
        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-tint {
            background: linear-gradient(
                185deg,
                rgba(8, 8, 8, 0.12) 0%,
                rgba(8, 8, 8, 0.38) 48%,
                rgba(8, 8, 8, 0.82) 100%
            );
        }
        .hero-copy {
            text-shadow: 0 1px 24px rgba(0, 0, 0, 0.45);
        }
        .filter-btn {
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            padding: 0.45rem 0;
            margin: 0;
            border: none;
            border-bottom: 1px solid transparent;
            background: none;
            cursor: pointer;
            border-radius: 2px;
            transition: color 0.22s ease, border-color 0.22s ease;
        }
        .filter-btn:hover {
            color: #c4bfb8;
        }
        .filter-btn.active {
            color: var(--fg);
            font-weight: 500;
            border-bottom-color: rgba(240, 235, 229, 0.42);
        }
        .filter-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring);
        }
        .search-minimal {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 0.625rem;
            padding: 0.65rem 1rem;
            min-height: 2.75rem;
            font-size: 0.9375rem;
            line-height: 1.4;
            color: var(--fg);
            width: 100%;
            max-width: 20rem;
            caret-color: var(--fg);
            transition: border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
        }
        .search-minimal::placeholder {
            color: var(--muted-deep);
            opacity: 1;
        }
        .search-minimal:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: var(--surface-hover);
        }
        .search-minimal:focus {
            outline: none;
            border-color: rgba(240, 235, 229, 0.28);
            background: var(--surface-hover);
            box-shadow: 0 0 0 3px rgba(240, 235, 229, 0.06);
        }
        .search-minimal:focus-visible {
            border-color: rgba(240, 235, 229, 0.32);
        }
        .card-wrap {
            border-radius: 0.375rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.35s ease, box-shadow 0.35s ease, transform 0.35s ease;
        }
        .card-wrap:hover {
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
        }
        .card-wrap:hover .card-img {
            transform: scale(1.03);
        }
        .card-img {
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-meta {
            font-size: 0.75rem;
            line-height: 1.45;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted-deep);
        }
        .card-title {
            font-size: 1.0625rem;
            line-height: 1.35;
            letter-spacing: -0.01em;
        }
        @media (min-width: 640px) {
            .card-title {
                font-size: 1.125rem;
            }
        }
        .btn-text {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 0.65rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }
        .btn-text:hover {
            color: var(--fg);
            border-color: var(--line);
            background: var(--surface);
        }
        .btn-text:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring);
        }
        #scrollToTop {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease, transform 0.28s ease;
            transform: translateY(6px);
        }
        #scrollToTop.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        #scrollToTop:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring);
        }
        .nav-link:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <header class="fixed top-0 left-0 right-0 z-50 nav-blur bg-[var(--bg)]/88 border-b border-[var(--line)]">
        <div class="max-w-[1600px] mx-auto px-5 sm:px-8 min-h-[3.25rem] sm:min-h-[3.5rem] py-2.5 sm:py-3 grid grid-cols-[1fr_auto_1fr] items-center gap-3">
            <a href="#explorer" class="nav-link justify-self-start text-sm text-[var(--muted)] hover:text-[var(--fg)] transition-colors duration-200">Designs</a>
            <h1 class="font-serif text-center text-base sm:text-[1.125rem] tracking-[0.08em] text-[var(--fg)] font-normal m-0 px-2 leading-snug">Nine carat jewelry</h1>
            <span class="justify-self-end w-12 sm:w-14" aria-hidden="true"></span>
        </div>
    </header>

    <main class="pt-[3.25rem] sm:pt-[3.5rem]">
        <section id="hero" class="relative aspect-[21/10] min-h-[240px] max-h-[min(56vh,560px)] w-full overflow-hidden">
            {% if hero_img_src %}
            <div class="absolute inset-0 hero-bg">
                <img src="{{ hero_img_src }}" alt="" class="brightness-[0.88] contrast-[1.02]"/>
            </div>
            {% endif %}
            <div class="absolute inset-0 hero-tint"></div>
            <div class="absolute inset-0 flex items-end">
                <div class="w-full max-w-[1600px] mx-auto px-5 sm:px-8 pb-10 sm:pb-12 md:pb-14">
                    <p class="hero-copy font-serif text-[1.65rem] sm:text-3xl md:text-[2.125rem] font-normal text-white leading-[1.15] tracking-[-0.02em]">Nine carat jewelry</p>
                    <p class="hero-copy mt-3 text-sm sm:text-[0.9375rem] text-white/72 font-normal tracking-[0.05em]">Design catalog</p>
                </div>
            </div>
        </section>

        <section id="explorer" class="max-w-[1600px] mx-auto px-5 sm:px-8 pt-14 sm:pt-20 pb-24 sm:pb-32">
            <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-10 lg:gap-16 border-b border-[var(--line)] pb-10 mb-12 sm:mb-14">
                <div class="flex flex-wrap gap-x-8 gap-y-3" id="categoryButtons" role="tablist" aria-label="Categories"></div>
                <label class="sr-only" for="searchInput">Search designs</label>
                <input id="searchInput" type="search" autocomplete="off" placeholder="Search by name or category" class="search-minimal lg:ml-auto lg:text-right lg:placeholder:text-right"/>
            </div>

            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2 sm:gap-6 mb-10 sm:mb-12">
                <div>
                    <h2 class="font-serif text-xl sm:text-2xl font-normal text-[var(--fg)] tracking-tight">Gallery</h2>
                    <p class="mt-1.5 text-sm text-[var(--muted)] max-w-xs leading-relaxed">Browse by category or search the collection.</p>
                </div>
                <p id="resultCount" class="text-sm text-[var(--muted)] tabular-nums sm:pb-0.5 shrink-0" aria-live="polite"></p>
            </div>

            <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-7 lg:gap-8"></div>

            <div class="mt-16 sm:mt-20 flex justify-center">
                <button type="button" id="loadMoreBtn" onclick="loadMorePieces()" class="btn-text">
                    Load more
                </button>
            </div>
        </section>
    </main>

    <footer class="border-t border-[var(--line)] py-12 sm:py-14">
        <p class="text-center text-sm text-[var(--muted-deep)] tracking-[0.06em]">Nine carat jewelry</p>
    </footer>

    <button type="button" id="scrollToTop" aria-label="Back to top" class="fixed bottom-7 right-6 sm:right-8 z-50 h-11 w-11 rounded-full border border-[var(--line)] bg-[var(--surface)]/95 text-[var(--muted)] text-base leading-none shadow-[0_8px_32px_rgba(0,0,0,0.4)] hover:text-[var(--fg)] hover:border-[rgba(255,255,255,0.14)] hover:bg-[var(--surface-hover)] transition-[color,border-color,background-color,box-shadow] duration-200">
        ↑
    </button>

    <script>
        let catalogData = [];
        let filteredData = [];
        let categories = [];
        let displayedCount = 0;
        const itemsPerPage = 12;
        let currentCategory = 'all';
        let searchQuery = '';

        async function loadCatalog() {
            try {
                const [catalogResponse, categoriesResponse] = await Promise.all([
                    fetch('/api/catalog'),
                    fetch('/api/categories')
                ]);
                if (!catalogResponse.ok || !categoriesResponse.ok) {
                    throw new Error(`Catalog API error ${catalogResponse.status}, categories API error ${categoriesResponse.status}`);
                }
                catalogData = await catalogResponse.json();
                categories = await categoriesResponse.json();
                filteredData = [...catalogData];

                buildSidebarCategories();
                updateResultCount();
                document.getElementById('catalog').innerHTML = '';
                document.getElementById('loadMoreBtn').style.display = 'inline-flex';
                displayItems(itemsPerPage);
            } catch (error) {
                console.error('Error loading catalog:', error);
                document.getElementById('catalog').innerHTML = '<p class="text-[var(--muted)] text-sm col-span-full py-16 text-center leading-relaxed max-w-sm mx-auto">Could not load designs. Check your connection and try refreshing the page.</p>';
            }
        }

        function buildSidebarCategories() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            addCategoryChip('all', 'All', true);
            categories.forEach(category => addCategoryChip(category, category, false));
        }

        function addCategoryChip(key, label, active) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = label;
            button.dataset.category = key;
            button.className = 'filter-btn' + (active ? ' active' : '');
            button.addEventListener('click', () => {
                document.querySelectorAll('#categoryButtons .filter-btn').forEach(item => item.classList.remove('active'));
                button.classList.add('active');
                filterByCategory(key);
            });
            document.getElementById('categoryButtons').appendChild(button);
        }

        function filterByCategory(category) {
            currentCategory = category;
            applyFilters();
        }

        function searchItems(query) {
            searchQuery = query.toLowerCase();
            applyFilters();
        }

        function applyFilters() {
            filteredData = catalogData.filter(item => {
                const matchesCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = !searchQuery || [item.design_number, item.category, item.material].some(text => text.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });
            displayedCount = 0;
            document.getElementById('catalog').innerHTML = '';
            updateResultCount();
            displayItems(itemsPerPage);
        }

        function updateResultCount() {
            const n = filteredData.length;
            document.getElementById('resultCount').textContent = n === 1 ? '1 design' : n + ' designs';
        }

        function displayItems(count) {
            const container = document.getElementById('catalog');
            const itemsToShow = filteredData.slice(displayedCount, displayedCount + count);
            if (displayedCount === 0 && itemsToShow.length === 0) {
                container.innerHTML = '<p class="text-[var(--muted)] text-sm col-span-full py-20 text-center leading-relaxed">No designs match your filters. Try another category or clear the search.</p>';
            }
            itemsToShow.forEach(item => container.appendChild(createProductCard(item)));
            displayedCount += itemsToShow.length;
            document.getElementById('loadMoreBtn').style.display = displayedCount >= filteredData.length ? 'none' : 'inline-flex';
        }

        function createProductCard(item) {
            const card = document.createElement('article');
            card.className = 'card-wrap bg-[var(--surface)] overflow-hidden';
            card.innerHTML = `
                <div class="relative aspect-[3/4] overflow-hidden bg-[#0a0a0a]">
                    <img src="${item.src}" alt="${item.design_number}" class="card-img w-full h-full object-cover" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect fill=%22%23141414%22 width=%22100%22 height=%22100%22/%3E%3C/svg%3E'" />
                </div>
                <div class="px-5 py-5 sm:px-6 sm:py-6">
                    <p class="card-meta mb-2">${item.category}</p>
                    <h3 class="card-title font-serif text-[var(--fg)] font-medium">${item.design_number}</h3>
                </div>
            `;
            return card;
        }

        function loadMorePieces() {
            displayItems(itemsPerPage);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const scrollButton = document.getElementById('scrollToTop');
            if (searchInput) {
                searchInput.addEventListener('input', event => searchItems(event.target.value));
            }
            if (scrollButton) {
                scrollButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            }
            window.addEventListener('scroll', () => {
                scrollButton.classList.toggle('visible', window.scrollY > 360);
            });
            loadCatalog();
        });
    </script>
</body>
</html>
